<script type="text/javascript">
for(let i=2;i<=200;i+=2){
	if(i%2===0){
		document.write(i+"->");
		console.log(i);
		var pom=Math.pow(i,2);
		document.write(pom+"<br>");
		console.log(pom);
	}
}
